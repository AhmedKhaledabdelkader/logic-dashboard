<form [formGroup]="form" (ngSubmit)="save()" novalidate>
  <app-section-card step="5" title="Featured Insights"
      description="Choose the insights shown on the home page (up to 3). Create and edit the insights themselves in the Insights tab."
      [saving]="saving()" [loading]="loading()">

    <!-- Dropdown -->
    <label class="form-label" for="insight-picker">Add an insight</label>

    <select #picker id="insight-picker" class="form-select mb-2"
            [disabled]="!available().length || selectedIds().length >= MAX"
            (change)="add(+picker.value); picker.value = ''">
      <option value="" selected>{{ placeholder() }}</option>
      @for (i of available(); track i.id) {
        <option [value]="i.id">{{ i.title }}</option>
      }
    </select>

    <div class="d-flex justify-content-between">
      <app-field-error [control]="form.controls.insightIds"
          [messages]="{ required: 'Select at least one insight.', maxlength: 'You can select up to 3 insights.' }" />
      <small class="text-muted ms-auto">{{ selectedIds().length }}/{{ MAX }} selected</small>
    </div>

    @if (!loading() && !allInsights().length) {
      <div class="alert alert-warning rounded-0 mt-3 mb-0">
        There are no insights yet. <a routerLink="/insights">Add one in the Insights tab</a> first.
      </div>
    }

    <!-- Chosen insights, in display order -->
    <div class="mt-4">
      @for (item of selected(); track item.id; let i = $index) {
        <div class="picked">
          <span class="order">{{ i + 1 }}</span>
          <img [src]="item.image" [alt]="item.title">
          <span class="title">{{ item.title }}</span>

          <div class="btn-group btn-group-sm">
            <button type="button" class="btn btn-outline-secondary" aria-label="Move up"
                    [disabled]="i === 0" (click)="move(i, -1)"><i class="bi bi-arrow-up"></i></button>
            <button type="button" class="btn btn-outline-secondary" aria-label="Move down"
                    [disabled]="i === selected().length - 1" (click)="move(i, 1)"><i class="bi bi-arrow-down"></i></button>
            <button type="button" class="btn btn-outline-danger" aria-label="Remove"
                    (click)="remove(item.id)"><i class="bi bi-x-lg"></i></button>
          </div>
        </div>
      } @empty {
        <div class="empty"><i class="bi bi-lightbulb"></i> No insights selected yet.</div>
      }
    </div>

  </app-section-card>
</form>
